<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Intraduire</title>

<script>
  // Redirige vers le quiz à la PREMIÈRE visite (avant tout rendu, pas de flash)
  (function () {
    try {
      if (!localStorage.getItem('intraduire-quiz-seen')) {
        location.replace('quiz.html');
      }
    } catch (e) {}
  })();
</script>

<script>
  // Thème (clair/sombre) appliqué avant le paint pour éviter le flash
  (function () {
    try {
      var t = localStorage.getItem('intraduire-theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var fs = parseFloat(localStorage.getItem('intraduire-fscale'));
      if (!isNaN(fs)) {
        fs = Math.min(1.5, Math.max(0.9, fs));
        document.documentElement.style.setProperty('--fscale', fs);
      }
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=Amiri:wght@400;700&family=Caveat:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Palette « Vélin chaud » */
    --paper: #efe9d8;
    --ink: #2b1f15;
    --ink-2: #4e4338;
    --muted: #6a6253;
    --accent: #8a3a1f;
    --paper-2: #e4dcc6;
    --lettrine-size: 150px;
    --measure: 38rem;
    --rule: rgba(26,25,22,0.30);
    --fscale: 1;
  }

  /* ── Vue sombre ─────────────────────────────────────────────── */
  html[data-theme="dark"] {
    --paper: #15120d;
    --ink: #ece4d4;
    --ink-2: #c9c0ad;
    --muted: #8c8474;
    --accent: #c2613a;
    --paper-2: #211c14;
    --rule: rgba(236,228,212,0.16);
  }

  *, *::before, *::after { box-sizing: border-box; }

  /* Accessibilité : indicateur de focus clavier visible */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }
  /* Accessibilité : respect du « réduire les animations » */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .reveal { opacity: 1 !important; transform: none !important; }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Newsreader", Georgia, serif;
    font-size: calc(18px * var(--fscale));
    line-height: 1.6;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  html { overflow-x: hidden; } /* clippe le plein-cadre ; scroller racine unique (sûr iOS) */

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(ellipse 1200px 800px at 20% 10%, rgba(58,56,51,0.045), transparent 60%),
      radial-gradient(ellipse 900px 700px at 85% 90%, rgba(184,68,46,0.035), transparent 65%);
    opacity: var(--grain-opacity, 1);
    transition: opacity 300ms ease;
  }
  html[data-theme="dark"] body::before {
    background-image:
      radial-gradient(ellipse 1200px 800px at 20% 10%, rgba(236,228,212,0.05), transparent 60%),
      radial-gradient(ellipse 900px 700px at 85% 90%, rgba(194,97,58,0.06), transparent 65%);
  }

  body > * { position: relative; z-index: 1; }

  p { text-wrap: pretty; margin: 0 0 1.1em; }
  h1, h2, h3 { text-wrap: balance; }
  a { color: inherit; }

  /* Layout shell --------------------------------------------------- */

  .shell {
    width: 100%;
    max-width: var(--measure);
    margin: 0 auto;
    padding: 56px 28px 80px;
  }

  /* Screen transitions --------------------------------------------- */

  .screen {
    opacity: 0;
    visibility: hidden; /* inerte au hit-test (iOS) : pas de calque fantôme qui bloque le scroll */
    transition: opacity 320ms ease, visibility 0s linear 320ms;
    pointer-events: none;
    position: absolute;
    inset: 0;
    overflow: clip;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    transition: opacity 320ms ease, visibility 0s linear 0s;
    pointer-events: auto;
    position: relative;
    overflow: visible; /* défilement vertical = la fenêtre, conteneur unique (clip horizontal via html) */
  }
  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh; /* hauteur visible réelle sur mobile (barre d'adresse) */
  }

  /* ── ACCUEIL ──────────────────────────────────────────────────── */

  /* ── Colophon (logo) ──────────────────────────────────────── */
  .colophon-wrap {
    text-align: center;
    margin: 8px 0 52px;
  }
  .colophon {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    text-align: left;
  }
  .col-seal {
    font-family: "Amiri", serif;
    font-size: 50px;
    line-height: 1;
    color: var(--ink);
    direction: rtl;
    user-select: none;
  }
  .col-rule {
    width: 1px;
    align-self: stretch;
    min-height: 42px;
    background: var(--accent);
    opacity: 0.9;
  }
  .col-text {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .col-name {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink);
    padding-right: 0.3em;
  }
  .col-tag {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .col-seal { font-size: 42px; }
    .col-tag { display: none; }
  }

  .plume {
    display: block;
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--ink);
    padding: 14px 2px 16px;
    font-family: "Amiri", "Newsreader", serif;
    font-size: calc(24px * var(--fscale));
    line-height: 1;
    text-align: right;
    direction: rtl;
    color: var(--ink);
    outline: none;
    border-radius: 0;
    -webkit-appearance: none;
  }
  .plume::placeholder { color: var(--muted); opacity: 0.85; font-style: normal; }
  .plume:focus { border-bottom-color: var(--accent); }
  .plume:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .plume-hint {
    margin-top: 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
  }

  /* Bouton principal sous la plume — CTA visible pour ceux qui ne pensent pas à Entrée */
  .plume-go {
    display: block;
    margin: 18px auto 0;
    padding: 13px 32px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    border-radius: 2px;
    cursor: pointer;
    -webkit-appearance: none;
    transition: background 180ms ease, color 180ms ease;
  }
  .plume-go:hover { background: var(--ink); color: var(--paper); }
  .plume-go:disabled { opacity: 0.5; cursor: default; }

  /* Lien discret sous le bouton RÉVÉLER → page À propos */
  .plume-about {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 0.5px;
    transition: color 180ms ease;
  }
  .plume-about:hover { color: var(--accent); }

  /* Footer minimal sur l'accueil */
  .home-footer {
    margin-top: 88px;
    padding-top: 28px;
    border-top: 1px dotted var(--rule);
    text-align: center;
    font-family: "Newsreader", serif;
    font-size: 13px;
    color: var(--muted);
  }
  .home-footer a {
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 0.5px;
  }
  .home-footer a:hover { color: var(--accent); }
  .home-footer .sep { margin: 0 8px; opacity: 0.6; }

  .err {
    display: none;
    margin-top: 22px;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 15px;
    color: var(--accent);
    text-align: center;
    text-wrap: pretty;
  }
  .err.show { display: block; }

  .index-head {
    margin: 56px 0 18px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .toc { list-style: none; padding: 0; margin: 0; }
  .toc li {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: baseline;
    gap: 14px;
    padding: 18px 2px;
    border-bottom: 1px dotted var(--rule);
    cursor: pointer;
    transition: color 180ms ease;
  }
  .toc li:first-child { border-top: 1px dotted var(--rule); }
  .toc li:hover .toc-translit { color: var(--accent); }

  .toc-num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .toc-translit {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: calc(19px * var(--fscale));
    color: var(--ink);
    transition: color 180ms ease;
  }
  .toc-ar {
    font-family: "Amiri", serif;
    font-size: calc(24px * var(--fscale));
    line-height: 1;
    direction: rtl;
    color: var(--ink);
  }
  .toc li.toc-loading {
    display: block;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 16px;
    color: var(--muted);
    cursor: default;
  }

  /* ── CHARGEMENT ───────────────────────────────────────────────── */

  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px;
    text-align: center;
  }
  .loader-arabic {
    font-family: "Amiri", serif;
    font-size: 112px;
    line-height: 1;
    color: var(--ink);
    direction: rtl;
    margin-bottom: 72px;
    font-weight: 400;
  }
  .loader-phrase {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 19px;
    color: var(--ink-2);
    min-height: 1.6em;
    transition: opacity 400ms ease;
    max-width: 22em;
  }
  .loader-phrase.fading { opacity: 0; }
  .loader-dots {
    margin-top: 32px;
    display: inline-flex;
    gap: 8px;
  }
  .loader-dots span {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--ink);
    opacity: 0.25;
    animation: dotpulse 1400ms ease-in-out infinite;
  }
  .loader-dots span:nth-child(2) { animation-delay: 180ms; }
  .loader-dots span:nth-child(3) { animation-delay: 360ms; }
  @keyframes dotpulse {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50%      { opacity: 0.75; transform: translateY(-2px); }
  }

  /* ── ESSAI ─────────────────────────────────────────────────────── */

  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 1px;
    width: 0%;
    background: var(--accent);
    z-index: 50;
    transition: width 80ms linear;
  }

  /* Retour accueil = sceau Colophon cliquable (le logo = home) */
  .essay-home {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 40px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 180ms ease;
  }
  .essay-home:hover { opacity: 0.6; }
  .essay-home:hover .eh-seal { color: var(--accent); }
  .eh-seal {
    font-family: "Amiri", serif;
    font-size: 26px;
    line-height: 1;
    color: var(--ink);
    direction: rtl;
    transition: color 180ms ease;
  }
  .eh-rule {
    width: 1px;
    align-self: stretch;
    min-height: 20px;
    background: var(--accent);
    opacity: 0.9;
  }
  .eh-name {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    padding-right: 0.28em;
  }

  .essay-eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 40px;
  }

  .title-row {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 18px;
    align-items: start;
    margin: 12px 0 56px;
  }
  .lettrine {
    font-family: "Amiri", serif;
    font-size: var(--lettrine-size);
    line-height: 0.82;
    color: var(--ink);
    direction: rtl;
    margin-top: -0.06em;
    user-select: none;
  }
  .title {
    font-family: "Newsreader", serif;
    font-weight: 400;
    font-size: calc(clamp(28px, 6vw, 36px) * var(--fscale));
    line-height: 1.15;
    letter-spacing: -0.005em;
    margin: 0.18em 0 0;
  }
  .title em { font-style: italic; }

  .running-head {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 14px;
    align-items: center;
    margin: 64px 0 28px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .running-head .rh-rule {
    height: 1px;
    background: var(--rule);
  }

  .section p {
    color: var(--ink-2);
    font-size: calc(17px * var(--fscale));
    line-height: 1.65;
  }
  .section p strong {
    font-weight: 500;
    color: var(--ink);
  }
  .section .ar-inline {
    font-family: "Amiri", serif;
    font-size: calc(22px * var(--fscale));
    line-height: 1;
    direction: rtl;
    color: var(--ink);
    white-space: nowrap;
  }
  .section .translit { font-style: italic; }

  /* ── PHRASE SIGNATURE ─────────────────────────────────────────── */

  .signature {
    margin: 72px -28px 72px;
    padding: 56px 36px 44px;
    background: var(--paper-2);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    text-align: center;
  }
  .signature-quote {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: calc(clamp(22px, 4.4vw, 26px) * var(--fscale));
    line-height: 1.35;
    color: var(--ink);
    margin: 0 auto 32px;
    text-wrap: balance;
    max-width: 22ch;
  }
  .signature-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── QUESTION DE CLÔTURE ──────────────────────────────────────── */

  .closing {
    margin: 96px -28px -80px;
    padding: 96px 36px 120px;
    background: var(--ink);
    color: var(--paper);
    text-align: left;
  }
  .closing-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .closing-q {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: calc(clamp(22px, 4.6vw, 26px) * var(--fscale));
    line-height: 1.4;
    color: var(--paper);
    margin: 0;
    max-width: 20ch;
    text-wrap: balance;
  }

  /* ── Reveal animation (essai) ────────────────────────────────── */

  .reveal { opacity: 0; transform: translateY(8px); transition: opacity 520ms ease, transform 520ms ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* ── Bascule de thème ───────────────────────────────────────── */
  .theme-toggle {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 60;
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; margin: 0;
    background: transparent; border: 0; border-radius: 0;
    color: var(--muted);
    cursor: pointer;
    -webkit-appearance: none;
    transition: color 180ms ease;
  }
  .theme-toggle:hover { color: var(--accent); }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
  .theme-toggle .icon-sun,
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  html:not([data-theme="dark"]) .theme-toggle .icon-moon { display: block; }

  /* ── Retour en haut ─────────────────────────────────────────── */
  .to-top {
    position: fixed;
    bottom: 20px; right: 16px;
    z-index: 60;
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; margin: 0;
    background: transparent; border: 0; border-radius: 0;
    color: var(--muted);
    cursor: pointer;
    -webkit-appearance: none;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 240ms ease, transform 240ms ease, color 180ms ease;
  }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .to-top:hover { color: var(--accent); }
  .to-top svg { width: 18px; height: 18px; display: block; }

  /* ── Taille du texte ────────────────────────────────────────── */
  .text-size {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 60;
    display: inline-flex;
    gap: 2px;
  }
  .ts-btn {
    min-width: 32px; height: 34px;
    padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; border-radius: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    -webkit-appearance: none;
    transition: color 180ms ease;
  }
  .ts-btn:hover { color: var(--accent); }
  .ts-btn:disabled { opacity: 0.35; cursor: default; }

  /* Pastille opaque : empêche les contrôles fixes de se confondre avec le contenu défilant dessous */
  .text-size, .theme-toggle, .to-top {
    background: var(--paper);
    border-radius: 999px;
    box-shadow: 0 0 0 1px var(--rule);
  }
  .text-size { padding: 3px 5px; }

  /* ── Suggestion / remarque (discret, sous la clôture) ───────── */
  .suggest {
    /* clôture a margin-bottom:-80 → on compense pour décoller franchement */
    margin: 120px 0 0;
    padding-top: 32px;
    border-top: 1px dotted var(--rule);
    text-align: center;
  }
  .suggest-toggle {
    background: transparent; border: 0; padding: 8px 4px;
    cursor: pointer; -webkit-appearance: none;
    font-family: "Newsreader", serif; font-style: italic;
    font-size: 18px; color: var(--ink-2);
    text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 0.5px;
    transition: color 180ms ease;
  }
  .suggest-toggle:hover:not(:disabled) { color: var(--accent); }
  .suggest-toggle:disabled { cursor: default; text-decoration: none; }
  .suggest-form {
    max-width: 30rem; margin: 22px auto 0;
    text-align: left; display: grid; gap: 12px;
  }
  .suggest-form[hidden] { display: none; } /* l'attribut HTML hidden doit gagner sur display:grid */
  .suggest-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }
  .suggest-text, .suggest-email {
    width: 100%; background: var(--paper-2);
    border: 1px solid var(--rule); border-radius: 3px;
    padding: 12px 14px; color: var(--ink);
    font-family: "Newsreader", serif; font-size: 16px;
    outline: none; -webkit-appearance: none;
  }
  .suggest-text { resize: vertical; min-height: 5em; }
  .suggest-email { font-size: 14px; }
  .suggest-text:focus, .suggest-email:focus { border-color: var(--accent); }
  .suggest-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .suggest-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .suggest-send {
    background: transparent; border: 1px solid var(--ink); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 11px 20px; border-radius: 2px; cursor: pointer;
    -webkit-appearance: none; transition: background 180ms ease, color 180ms ease;
  }
  .suggest-send:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .suggest-send:disabled { opacity: 0.5; cursor: default; }
  .suggest-status { font-family: "Newsreader", serif; font-style: italic; font-size: 14px; color: var(--muted); }

  /* Mobile tightening */
  @media (max-width: 480px) {
    .shell { padding: 40px 22px 64px; }
    /* Sur mobile, descend le retour-accueil pour qu'il ne soit pas masqué par la pastille A−/A+ fixée en haut */
    .essay-home { margin-top: 24px; }
    .signature, .closing { margin-left: -22px; margin-right: -22px; padding-left: 28px; padding-right: 28px; }
    .closing { padding: 80px 28px 96px; }
    :root { --lettrine-size: 104px; }
    body { font-size: calc(17px * var(--fscale)); }
  }
</style>
</head>
<body>

<div class="text-size" role="group" aria-label="Taille du texte">
  <button class="ts-btn" id="ts-dec" type="button" aria-label="Diminuer la taille du texte">A−</button>
  <button class="ts-btn" id="ts-inc" type="button" aria-label="Augmenter la taille du texte">A+</button>
</div>

<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Basculer la vue">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.4A8 8 0 0 1 9.6 4 6.5 6.5 0 1 0 20 14.4Z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.1"/>
    <path d="M12 2.6v2.3 M12 19.1v2.3 M2.6 12h2.3 M19.1 12h2.3 M5.2 5.2l1.6 1.6 M17.2 17.2l1.6 1.6 M18.8 5.2l-1.6 1.6 M6.8 17.2l-1.6 1.6"/>
  </svg>
</button>

<button class="to-top" id="to-top" type="button" aria-label="Remonter en haut">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5 M6 11l6-6 6 6"/>
  </svg>
</button>

<div class="progress" id="progress"></div>

<div class="stage">

  <!-- ════════════ ACCUEIL ════════════ -->
  <section class="screen active" id="screen-home" aria-label="Accueil">
    <div class="shell">
      <div class="colophon-wrap">
        <span class="colophon" role="img" aria-label="Intraduire, essai sur les mots intraduisibles">
          <span class="col-seal" aria-hidden="true">ت</span>
          <span class="col-rule" aria-hidden="true"></span>
          <span class="col-text">
            <span class="col-name">Intraduire</span>
            <span class="col-tag">essai sur les mots intraduisibles</span>
          </span>
        </span>
      </div>

      <input
        class="plume"
        type="text"
        id="plume"
        placeholder="اكتب كلمة…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Saisir un mot arabe" />
      <button class="plume-go" id="plume-go" type="button">Révéler</button>
      <a class="plume-about" href="a-propos.html">À propos · la méthode</a>

      <div class="err" id="err"></div>

      <div id="index-section" style="display:none">
        <div class="index-head">
          <span id="index-count">Index</span>
        </div>
        <ul class="toc" id="toc"></ul>
      </div>

      <footer class="home-footer">
        <a href="a-propos.html">À propos</a> <span class="sep">·</span> <a href="quiz.html">Refaire le quiz</a> <span class="sep">·</span> projet éducatif
      </footer>
    </div>
  </section>

  <!-- ════════════ CHARGEMENT ════════════ -->
  <section class="screen" id="screen-loading" aria-label="Chargement">
    <div class="loader">
      <div class="loader-arabic" id="loader-ar"></div>
      <div class="loader-phrase" id="loader-phrase" aria-live="polite">On ouvre le manuscrit…</div>
      <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- ════════════ RÉSULTAT — ESSAI ════════════ -->
  <section class="screen" id="screen-essay" aria-label="Essai">
    <div class="shell">

      <a class="essay-home" id="back-link" role="link" tabindex="0" aria-label="Retour à l'accueil">
        <span class="eh-seal" aria-hidden="true">ت</span>
        <span class="eh-rule" aria-hidden="true"></span>
        <span class="eh-name">Intraduire</span>
      </a>

      <div class="essay-eyebrow reveal" id="ess-eyebrow"></div>

      <header class="title-row reveal">
        <div class="lettrine" id="ess-lettrine" aria-hidden="true"></div>
        <h1 class="title"><em id="ess-title"></em></h1>
      </header>

      <article id="ess-article"></article>

      <section class="suggest reveal" id="suggest" hidden aria-label="Proposer une nuance">
        <button class="suggest-toggle" id="suggest-toggle" type="button" aria-expanded="false" aria-controls="suggest-form">Tu traduirais autrement&nbsp;?</button>
        <form class="suggest-form" id="suggest-form" hidden>
          <label class="suggest-label" for="suggest-text">Ta nuance, ta remarque</label>
          <textarea class="suggest-text" id="suggest-text" rows="3" maxlength="1200" placeholder="Une proposition, une correction, une nuance sur la traduction…"></textarea>
          <input class="suggest-email" id="suggest-email" type="email" autocomplete="email" placeholder="ton e-mail (facultatif, pour une réponse)" />
          <input class="suggest-hp" id="suggest-hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="suggest-row">
            <button class="suggest-send" id="suggest-send" type="submit">Envoyer</button>
            <span class="suggest-status" id="suggest-status" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </div>
  </section>

</div>

<!-- Flow controller (vanilla) — backend repris de intraduire-agent.html -->
<script>
  (function () {
    // Endpoint Google Apps Script (web app public, déjà déployé) — repris tel quel
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxXU7Q5LL0lkRkOJgA1wV6YbV6k_4i2x9wkP2yQGUtSpu4o9iLPd28xebECjZVGLdTLRw/exec";

    const screens = {
      home: document.getElementById('screen-home'),
      loading: document.getElementById('screen-loading'),
      essay: document.getElementById('screen-essay'),
    };
    const plume = document.getElementById('plume');
    const errEl = document.getElementById('err');
    const loaderAr = document.getElementById('loader-ar');
    const loaderPhrase = document.getElementById('loader-phrase');

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const esc = (s) => String(s == null ? '' : s)
      .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let currentMot = '';        // mot arabe affiché (pour les suggestions)
    let suggestEnabled = false; // activé via le flag GAS action=config

    function show(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    }
    function showErr(m) { errEl.textContent = m; errEl.classList.add('show'); }
    function hideErr() { errEl.classList.remove('show'); errEl.textContent = ''; }

    // ── Index des mots déjà analysés (action=liste) ─────────────
    const LISTE_KEY = 'intraduire-liste';

    function showIndexLoading() {
      document.getElementById('toc').innerHTML =
        '<li class="toc-loading" aria-disabled="true">chargement de l’index…</li>';
      document.getElementById('index-count').textContent = 'Index';
      document.getElementById('index-section').style.display = '';
    }

    // Index : rendu instantané depuis le stockage local, puis rafraîchissement en fond
    async function chargerListe() {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(LISTE_KEY) || 'null'); } catch (e) {}
      const hasCache = Array.isArray(cached) && cached.length > 0;
      if (hasCache) renderTOC(cached);
      else showIndexLoading();

      try {
        const r = await fetch(GAS_URL + "?action=liste");
        const d = await r.json();
        if (d.success && Array.isArray(d.data) && d.data.length > 0) {
          const slim = d.data.map(m => ({ mot: m.mot, translitteration: m.translitteration }));
          try { localStorage.setItem(LISTE_KEY, JSON.stringify(slim)); } catch (e) {}
          renderTOC(slim);
        } else if (!hasCache) {
          document.getElementById('index-section').style.display = 'none';
        }
      } catch (e) {
        if (!hasCache) document.getElementById('index-section').style.display = 'none';
      }
    }
    // Tri alphabétique arabe (dictionnaire) — on ignore l'article « ال »
    const arCollator = new Intl.Collator('ar');
    const tocSortKey = (s) => {
      s = (s || '').trim();
      return s.startsWith('ال') ? s.slice(2) : s;
    };
    function renderTOC(mots) {
      const ul = document.getElementById('toc');
      ul.innerHTML = '';
      const sorted = mots.slice().sort((a, b) => arCollator.compare(tocSortKey(a.mot), tocSortKey(b.mot)));
      sorted.forEach((m, i) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'button');
        li.setAttribute('tabindex', '0');
        li.setAttribute('aria-label', `Lire ${m.translitteration || m.mot}`);
        li.innerHTML =
          `<span class="toc-num">${String(i + 1).padStart(2, '0')}</span>` +
          `<span class="toc-translit">${esc(m.translitteration)}</span>` +
          `<span class="toc-ar">${esc(m.mot)}</span>`;
        const open = () => startFlow(m.mot);
        li.addEventListener('click', open);
        li.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
        ul.appendChild(li);
      });
      document.getElementById('index-count').textContent =
        `Index · ${sorted.length} mot${sorted.length > 1 ? 's' : ''}`;
      document.getElementById('index-section').style.display = '';
    }

    // ── Phrases de chargement (défilent jusqu'à la réponse) ─────
    const phrases = [
      'On ouvre le manuscrit…',
      'Lecture de la racine…',
      'Mise en contexte…',
      'Recueil des nuances…',
      'Polissage…'
    ];
    let phraseTimer = null;
    function startPhrases() {
      let i = 0;
      loaderPhrase.textContent = phrases[0];
      loaderPhrase.classList.remove('fading');
      phraseTimer = setInterval(() => {
        if (i >= phrases.length - 1) return; // tient sur la dernière phrase
        loaderPhrase.classList.add('fading');
        setTimeout(() => {
          i++;
          loaderPhrase.textContent = phrases[i];
          loaderPhrase.classList.remove('fading');
        }, 300);
      }, 1700);
    }
    function stopPhrases() { clearInterval(phraseTimer); phraseTimer = null; }

    // ── Construction de l'essai depuis les données backend ──────
    const SECTIONS = [
      ['racine', 'Racine étymologique'],
      ['periodisation', 'Périodisation de la révélation'],
      ['coranique', 'Contexte coranique'],
      ['prophetique', 'Usage prophétique'],
      ['faux_amis', 'Faux amis français'],
      ['autres', 'Autres mots insuffisants'],
      ['antonyme', 'Antonyme coranique'],
      ['sensation', 'Sensation physique'],
      ['traduction', 'Traduction juste'],
    ];
    const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

    const paras = (txt) => String(txt).split(/\n+/).map(s => s.trim())
      .filter(Boolean).map(s => `<p>${esc(s)}</p>`).join('');

    function sectionHTML(roman, label, text) {
      return `<section class="section reveal">
        <div class="running-head"><span>${roman} · ${esc(label)}</span><span class="rh-rule"></span></div>
        ${paras(text)}
      </section>`;
    }
    function signatureHTML(sig) {
      return `<aside class="signature reveal" aria-label="Phrase signature">
        <p class="signature-quote">${esc(sig)}</p>
        <div class="signature-label">Phrase signature</div>
      </aside>`;
    }
    function closingHTML(q) {
      return `<aside class="closing reveal" aria-label="Question de clôture">
        <div class="closing-label">Et toi…</div>
        <p class="closing-q">${esc(q)}</p>
      </aside>`;
    }

    function buildEssay(data, mot) {
      const tr = data.translitteration || '';
      document.getElementById('ess-eyebrow').textContent = `Intraduire · ${tr || mot}`;
      document.getElementById('ess-lettrine').textContent = Array.from(mot)[0] || '';
      document.getElementById('ess-title').textContent = tr || mot;

      const present = SECTIONS.filter(([k]) => data[k] && String(data[k]).trim());
      const hasAntonyme = present.some(([k]) => k === 'antonyme');
      const parts = [];
      let n = 0;
      present.forEach(([k, label]) => {
        // La phrase signature casse le rythme juste avant l'antonyme
        if (k === 'antonyme' && data.signature) parts.push(signatureHTML(data.signature));
        n++;
        parts.push(sectionHTML(ROMAN[n - 1] || String(n), label, data[k]));
      });
      if (data.signature && !hasAntonyme) parts.push(signatureHTML(data.signature));
      if (data.question && String(data.question).trim()) parts.push(closingHTML(data.question));

      document.getElementById('ess-article').innerHTML = parts.join('');
    }

    // ── Révélation en cascade ───────────────────────────────────
    function revealEssay() {
      document.querySelectorAll('#screen-essay .reveal').forEach((el, i) => {
        if (el.hidden) return;
        setTimeout(() => el.classList.add('in'), 60 + i * 70);
      });
    }
    function resetEssayReveal() {
      document.querySelectorAll('#screen-essay .reveal').forEach(el => el.classList.remove('in'));
    }

    // ── Flow principal : saisie → chargement → essai ────────────
    async function startFlow(mot) {
      mot = (mot || '').trim();
      if (!mot) { showErr('Veuillez saisir un mot arabe.'); return; }
      hideErr();

      loaderAr.textContent = mot;
      show('loading');
      startPhrases();
      const started = Date.now();

      let data = null, error = null;
      try {
        const r = await fetch(`${GAS_URL}?action=analyser&mot=${encodeURIComponent(mot)}`);
        const d = await r.json();
        if (!d.success) throw new Error(d.error || 'Erreur inconnue');
        data = d.data;
      } catch (e) {
        error = e;
      }

      stopPhrases();
      // garde-fou : durée minimale pour éviter le flash quand c'est en cache
      const wait = Math.max(0, 900 - (Date.now() - started));
      if (wait) await sleep(wait);

      if (error) {
        show('home');
        showErr('Erreur : ' + error.message + '. Vérifiez que le Apps Script est bien déployé.');
        return;
      }

      currentMot = data.mot || mot;
      buildEssay(data, mot);
      document.getElementById('suggest').hidden = !suggestEnabled;
      resetEssayReveal();
      show('essay');
      requestAnimationFrame(() => requestAnimationFrame(revealEssay));
      chargerListe(); // un nouveau mot a pu être ajouté à l'index
    }

    // ── Écouteurs ───────────────────────────────────────────────
    plume.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); startFlow(plume.value); }
    });
    document.getElementById('plume-go').addEventListener('click', () => startFlow(plume.value));

    const backLink = document.getElementById('back-link');
    function goHome(e) {
      if (e) e.preventDefault();
      stopPhrases();
      show('home');
      hideErr();
      plume.value = '';
      plume.focus();
    }
    backLink.addEventListener('click', goHome);
    backLink.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(e); }
    });

    // ── Barre de progression de lecture ────────────────────────
    const progress = document.getElementById('progress');
    const toTop = document.getElementById('to-top');
    toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    function updateProgress() {
      if (!screens.essay.classList.contains('active')) {
        progress.style.width = '0%';
        toTop.classList.remove('show');
        return;
      }
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop;
      const max = (doc.scrollHeight - doc.clientHeight);
      const pct = max > 0 ? Math.min(100, (scrollTop / max) * 100) : 0;
      progress.style.width = pct.toFixed(2) + '%';
      toTop.classList.toggle('show', scrollTop > 500);
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);

    // ── Bascule de thème (clair / sombre) ───────────────────────
    const docEl = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    function syncTheme() {
      const dark = docEl.getAttribute('data-theme') === 'dark';
      themeBtn.setAttribute('aria-label', dark ? 'Passer en vue claire' : 'Passer en vue sombre');
      themeBtn.setAttribute('aria-pressed', String(dark));
    }
    themeBtn.addEventListener('click', () => {
      const next = docEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      docEl.setAttribute('data-theme', next);
      try { localStorage.setItem('intraduire-theme', next); } catch (e) {}
      syncTheme();
    });
    syncTheme();

    // ── Taille du texte (accessibilité) ─────────────────────────
    const FSCALE_KEY = 'intraduire-fscale';
    const FS_MIN = 0.9, FS_MAX = 1.5, FS_STEP = 0.1;
    const tsDec = document.getElementById('ts-dec');
    const tsInc = document.getElementById('ts-inc');
    let fscale = (() => {
      const v = parseFloat(localStorage.getItem(FSCALE_KEY));
      return isNaN(v) ? 1 : Math.min(FS_MAX, Math.max(FS_MIN, v));
    })();
    function applyFscale() {
      docEl.style.setProperty('--fscale', fscale);
      tsDec.disabled = fscale <= FS_MIN + 1e-9;
      tsInc.disabled = fscale >= FS_MAX - 1e-9;
      const pct = Math.round(fscale * 100);
      tsDec.setAttribute('aria-label', `Diminuer la taille du texte (actuel ${pct} %)`);
      tsInc.setAttribute('aria-label', `Augmenter la taille du texte (actuel ${pct} %)`);
    }
    function setFscale(v) {
      fscale = Math.min(FS_MAX, Math.max(FS_MIN, Math.round(v * 10) / 10));
      try { localStorage.setItem(FSCALE_KEY, fscale); } catch (e) {}
      applyFscale();
    }
    tsDec.addEventListener('click', () => setFscale(fscale - FS_STEP));
    tsInc.addEventListener('click', () => setFscale(fscale + FS_STEP));
    applyFscale();

    // ── Suggestions (affordance affichée seulement si flag GAS = ON) ─
    (function () {
      const toggle = document.getElementById('suggest-toggle');
      const form = document.getElementById('suggest-form');
      const txt = document.getElementById('suggest-text');
      const sendBtn = document.getElementById('suggest-send');
      const statusEl = document.getElementById('suggest-status');

      fetch(GAS_URL + '?action=config')
        .then(r => r.json())
        .then(d => { suggestEnabled = !!(d && d.success && d.data && d.data.suggestions); })
        .catch(() => {});

      toggle.addEventListener('click', () => {
        const opening = form.hidden;
        form.hidden = !opening;
        toggle.setAttribute('aria-expanded', String(opening));
        if (opening) txt.focus();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const texte = txt.value.trim();
        if (!texte) { statusEl.textContent = 'Écris ta nuance d’abord.'; txt.focus(); return; }
        sendBtn.disabled = true;
        statusEl.textContent = 'On note…';
        try {
          // GAS POST suit un 302 qui perd le body → on passe par GET (params URL).
          const qs = new URLSearchParams({
            action: 'suggestion',
            mot: currentMot,
            texte: texte,
            email: document.getElementById('suggest-email').value.trim(),
            hp: document.getElementById('suggest-hp').value
          });
          const r = await fetch(GAS_URL + '?' + qs.toString());
          let ok = true;
          try { const d = await r.json(); ok = d.success !== false; } catch (_) {}
          if (ok) {
            form.hidden = true;
            toggle.textContent = 'Merci, c’est noté.';
            toggle.disabled = true;
            toggle.setAttribute('aria-expanded', 'false');
            statusEl.textContent = ''; // ceinture/bretelle : on vide le statut même si le formulaire est caché
          } else {
            statusEl.textContent = 'Échec, réessaie.';
            sendBtn.disabled = false;
          }
        } catch (_) {
          statusEl.textContent = 'Échec de l’envoi, réessaie.';
          sendBtn.disabled = false;
        }
      });
    })();

    // ── Init ────────────────────────────────────────────────────
    chargerListe();
  })();
</script>

</body>
</html>
